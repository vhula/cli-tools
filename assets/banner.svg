<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">vhula cli-tools banner</title>
  <desc id="desc">A clean minimal banner for vhula's personal Go command-line tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00add8"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect x="92" y="78" width="1096" height="204" rx="20" fill="#0f172a" stroke="#1f2a3d"/>

  <text x="132" y="138" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600">
    github.com/vhula
  </text>

  <text x="132" y="205" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="700">
    cli-tools
  </text>

  <text x="132" y="248" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
    personal command-line tools in Go
  </text>

  <rect x="132" y="276" width="236" height="4" rx="2" fill="url(#line)"/>

  <g transform="translate(1016 134)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 34 L40 64 L0 94" stroke="#7dd3fc" stroke-width="12"/>
    <path d="M70 94 H152" stroke="#f8fafc" stroke-width="12"/>
  </g>
</svg>
